<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SETER Phantom Sovereign — Command &amp; Ops Console</title>
<style>
:root{color-scheme:dark;--bg:#040308;--panel:#0b0914;--panel2:#08060f;--border:#1d1730;--text:#e6e2f4;--dim:#857ba0;--violet:#a78bfa;--magenta:#f472b6;--green:#34d399;--amber:#fbbf24;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1100px 560px at 50% -8%,#1a0f33 0%,var(--bg) 58%);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;gap:13px;padding:15px 24px;border-bottom:1px solid var(--border);background:rgba(4,3,8,.85);backdrop-filter:blur(9px);position:sticky;top:0;z-index:6}
.crest{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--violet);display:grid;place-items:center;color:var(--violet);font-size:16px;box-shadow:0 0 16px #a78bfa33,inset 0 0 10px #a78bfa22}
header h1{margin:0;font-size:16.5px;letter-spacing:1.5px;text-transform:uppercase}.hs{color:var(--dim);font-size:12px;margin-top:1px}
.covert{margin-left:auto;display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.8px;background:#0b1620;border:1px solid #16304a;padding:7px 14px;border-radius:20px}
.covert .d{width:7px;height:7px;border-radius:50%;background:var(--green);animation:gp 1.5s infinite}
@keyframes gp{0%,100%{opacity:1}50%{opacity:.25}}
.wrap{max-width:1360px;margin:0 auto;padding:20px 24px 60px}
.topt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1000px){.topt{grid-template-columns:repeat(2,1fr)}}
.tstat{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:13px;padding:13px 15px;border-left:3px solid var(--bc,var(--violet))}
.tstat .l{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px}
.tstat .v{font-size:23px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
@media(max-width:1050px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden}
.panel>.h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
.panel>.h h2{margin:0;font-size:13.5px;letter-spacing:.5px;text-transform:uppercase}
.chip{padding:3px 10px;border-radius:18px;font-size:11px;font-weight:600}
.cv{background:#130f22;color:var(--violet)}.cg{background:#0b2019;color:var(--green)}.ca{background:#221a0d;color:var(--amber)}
.mlog{max-height:430px;overflow:auto}
.entry{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid #141021}
.entry:last-child{border-bottom:none}
.entry .cl{color:var(--magenta);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding-top:2px}
.entry .tt{font-size:13px;font-weight:600}.entry .de{color:var(--dim);font-size:11.5px;margin-top:2px}
.entry .cat{font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:5px;height:fit-content}
.cat.o{background:#1c1530;color:var(--violet)}.cat.i{background:#0b2019;color:var(--green)}.cat.m{background:#221a0d;color:var(--amber)}.cat.a{background:#2a1118;color:var(--red)}
.entry .no{margin-left:auto;color:#4a4268;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.formrow{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.formrow input{flex:1;background:#0a0813;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 12px;font-size:13px;outline:none}
.formrow input:focus{border-color:var(--violet)}
.formrow select{background:#0a0813;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 10px;font-size:12px;outline:none}
.formrow button{background:linear-gradient(135deg,#a78bfa,#7c6ef0);border:none;color:#0b0817;border-radius:9px;padding:0 16px;font-weight:800;cursor:pointer}
.cons{background:#05030a;height:300px;overflow:auto;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.75}
.cons .pr{color:var(--violet)}.cons .ok{color:var(--green)}.cons .wa{color:var(--amber)}.cons .er{color:var(--red)}.cons .d{color:#4a4268}
.cons .caret{display:inline-block;width:8px;height:14px;background:var(--violet);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.typebar{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.typebar button{background:#100c1e;border:1px solid var(--border);color:var(--dim);border-radius:15px;font-size:11px;padding:6px 11px;cursor:pointer;font-weight:600}
.typebar button:hover{border-color:var(--magenta);color:var(--magenta)}
.open{grid-template-columns:1fr;gap:16px}
.opsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:14px}
.op{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;border-top:3px solid var(--oc,var(--violet));cursor:pointer;transition:.15s}
.op:hover{transform:translateY(-2px);border-color:#3a3160}
.op .nm{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between}
.op .ds{color:var(--dim);font-size:11.5px;margin-top:4px;line-height:1.5}
.op .st{margin-top:9px;display:flex;align-items:center;gap:6px;font-size:11px}
.stbar{height:4px;background:#1a1430;border-radius:3px;overflow:hidden;margin-top:7px}
.stbar i{display:block;height:100%;width:var(--w,30%);background:var(--oc,var(--violet));border-radius:3px}
footer{margin-top:26px;color:#4a4268;font-size:12px;text-align:center;letter-spacing:1px}
</style>
</head>
<body>
<header>
  <div class="crest">☾</div>
  <div><h1>Seter · Phantom Sovereign</h1><div class="hs">Command &amp; operations console — silent sector</div></div>
  <span class="covert"><span class="d"></span>COVERT LINK: ACTIVE</span>
</header>
<div class="wrap">
  <div class="topt">
    <div class="tstat" style="--bc:#a78bfa"><div class="l">Ongoing ops</div><div class="v" id="sOps">3</div></div>
    <div class="tstat" style="--bc:#34d399"><div class="l">Mission log</div><div class="v" id="sLog">12</div></div>
    <div class="tstat" style="--bc:#fbbf24"><div class="l">Intel packets</div><div class="v" id="sIntel">4</div></div>
    <div class="tstat" style="--bc:#fb7185"><div class="l">Clearance</div><div class="v" id="sClear">Ω-7</div></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel" style="margin-bottom:16px">
        <div class="h"><h2>Mission log</h2><span class="chip cv">SECRET //</span>
          <button style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:7px;font-size:11px;padding:5px 10px;cursor:pointer" id="pushEvt">+ push event</button>
        </div>
        <div class="mlog" id="mlog"></div>
        <form class="formrow" id="logForm">
          <input id="logIn" placeholder="Log an event to the mission record…" autocomplete="off">
          <select id="logCat"><option value="ops">OPS</option><option value="intel">INTEL</option><option value="movement">MOVEMENT</option><option value="alert">ALERT</option></select>
          <button type="submit">Log</button>
        </form>
      </div>
      <div class="panel">
        <div class="h"><h2>Operations panel</h2><span class="chip cg" id="opState">3 running</span>
          <button style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:7px;font-size:11px;padding:5px 10px;cursor:pointer" id="newOp">+ spawn</button>
        </div>
        <div class="opsgrid" id="opsgrid"></div>
      </div>
    </div>

    <div class="panel">
      <div class="h"><h2>Console readout</h2><span class="chip cg">LIVE</span></div>
      <div class="cons" id="cons"></div>
      <div class="typebar" id="typebar"></div>
    </div>
  </div>
</div>
<footer>PHANTOM SOVEREIGN — OPERATING IN THE SILENT SECTOR</footer>
<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s)};
  var logSeq=1412;
  var log=[
    {t:"1412-01",cat:"ops",tt:"Phantom handoff complete",de:"Controls transferred to sovereign ship at 00:12Z.",seq:1401},
    {t:"1411-03",cat:"intel",tt:"Packet shadow-received",de:"Two-parity decode; source verified silent.",seq:1400},
    {t:"1411-01",cat:"movement",tt:"Convoy position locked",de:"Coasting track held; no emissions.",seq:1399},
    {t:"1410-07",cat:"alert",tt:"Perimeter anomaly (resolved)",de:"False contact logged from weather cell.",seq:1398}
  ];
  var intel=4,fmtClear="Ω-7";
  var ops=[
    {name:"Night Passage",code:"NP-9",desc:"Convoy escort across quiet band III. Passive contact only.",st:74,run:true},
    {name:"Echo Protocol",code:"EP-2",desc:"Corporate intel sweep; surface sources to cross-check.",st:41,run:true},
    {name:"Long Shadow",code:"LS-6",desc:"Persistent track on relay zeta. Pending decision.",st:12,run:true},
    {name:"Zero Press",code:"ZP-1",desc:"Comms blackout drill across the cell.",st:0,run:false}
  ];
  var term=[];

  function nowT(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0")}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  var catCls={ops:"o",intel:"i",movement:"m",alert:"a"};
  var catLbl={ops:"OPS",intel:"INTEL",movement:"MOVEMENT",alert:"ALERT"};

  function renderLog(){
    $("#sLog").textContent=log.length;
    var box=$("#mlog");
    box.innerHTML=log.map(function(e){
      return '<div class="entry"><div class="cl">'+e.t+'</div>'
        +'<div><div class="tt">'+esc(e.tt)+'</div><div class="de">'+esc(e.de)+'</div></div>'
        +'<span class="cat '+catCls[e.cat]+'">'+catLbl[e.cat]+'</span>'
        +'<span class="no">#'+e.seq+'</span></div>';
    }).join("");
    box.scrollTop=0;
  }
  function addLog(cat,tt,de){
    logSeq+=3;
    log.unshift({t:nowT()+"-"+String(logSeq%100),cat:cat,tt:tt,de:de,seq:logSeq});
    if(log.length>60)log.pop();
    renderLog();also();
  }
  $("#logForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var v=$("#logIn").value.trim();
    if(!v)return;
    addLog($("#logCat").value,v,"Manual entry from command.");
    $("#logIn").value="";
  });
  $("#pushEvt").onclick=function(){
    var pool=[
      ["intel","Package mirrored to vault 7",intel+"th packet decrypted clean."],
      ["movement","Convoy vector corrected","Track starboard 4°; no emissions."],
      ["alert","WISP detection in sector 4","Temporary link spike; under observation."],
      ["ops","Resupply window opened","Quiet deck transfer slot on standby."]
    ];
    var p=pool[Math.floor(Math.random()*pool.length)];
    if(p[0]==="intel")intel++;
    addLog(p[0],p[1],p[2]);
  };
  function renderOps(){
    var run=ops.filter(function(o){return o.run}).length;
    $("#opState").textContent=run+" running";
    $("#sOps").textContent=run;
    var box=$("#opsgrid");
    box.innerHTML=ops.map(function(o,i){
      return '<div class="op" style="--oc:'+(o.run?"#a78bfa":"#3a3160")+'" data-i="'+i+'">'
        +'<div class="nm"><span>'+esc(o.name)+'</span><span style="color:var(--dim);font-size:11px;font-weight:500">'+o.code+'</span></div>'
        +'<div class="ds">'+esc(o.desc)+'</div>'
        +'<div class="st"><span style="color:'+(o.run?"#34d399":"#574f78")+'">'+(o.run?"● running":"○ standby")+'</span><span style="margin-left:auto">'+o.st+'%</span></div>'
        +'<div class="stbar"><i style="--w:'+o.st+'%"></i></div></div>';
    }).join("");
    box.querySelectorAll(".op").forEach(function(c){c.onclick=function(){
      var o=ops[+c.dataset.i];
      o.run=!o.run;
      addLog("ops",o.name+" "+(o.run?"engaged":"stood down"),"Action status cleared by command "+nowT()+".");
      renderOps();
    }});
  }
  $("#newOp").onclick=function(){
    var pool=["Ghost Yard","Red Envelope","Clean Slate","Soft Landing","Iron Curtain"];
    var n=pool[Math.floor(Math.random()*pool.length)]+" "+String(Math.floor(Math.random()*90)+10);
    ops.push({name:n,code:"OP-"+String(Math.floor(Math.random()*90)+10),desc:"Spawned from command line; details pending.",st:0,run:Math.random()<.6});
    addLog("ops",n+" opened","Operation file created on oak site.");
    renderOps();
  };

  function cons(type,txt){
    if(term.length>140)term.shift();
    var el=document.createElement("div");
    el.className=type?(type==="ok"?"ok":type):"";
    el.textContent=txt;
    $("#cons").appendChild(el);$("#cons").scrollTop=$("#cons").scrollHeight;
  }
  function also(){$("#sIntel").textContent=intel}
  var lines=[
    ["d","  __________________ … phantom boot v6.3"],
    ["d","  sector clock locked · 02:14Z · cipher XTS-4096"],
    ["ok","  auth: sovereign passes — welcome back, operator."],
    ["","  mission log 12 entries · 3 ops live · Ω-7 clearance"],
    ["pr","seter $ _"]
  ];
  (function boot(){
    var i=0;
    (function next(){
      if(i>=lines.length){setTimeout(function(){tick()},800);return}
      var l=lines[i++];
      cons(l[0]===""?"":l[0],l[1]);
      setTimeout(next,240);
    })();
  })();
  function tick(){
    var cmds=[
      ["ok","  status: covert link stable · 0 packets pending"],
      ["wa","  warning: thermal drift on packet bay — nominal band"],
      ["ok","  intel packet #+"+intel+" received · decoded clean"],
      ["","  hearts darkened; records sealed."]
    ];
    setTimeout(function(){
      var c=cmds[Math.floor(Math.random()*cmds.length)];
      cons(c[0],c[1]);
      cons("pr","seter $ "+String.fromCharCode(48+Math.floor(Math.random()*20)),"").classList.add("pr");
      setTimeout(tick,5200);
    },600);
  }
  $("#typebar").innerHTML=["status","routes","intel","clear","seal"].map(function(w){
    return "<button data-w='"+w+"'>"+w+"</button>"
  }).join("");
  document.querySelectorAll("#typebar button").forEach(function(b){b.onclick=function(){typeWord(b.dataset.w)}});
  function typeWord(w){
    var map={status:["ok","  covert link: ACTIVE · crypto nominal · 0 pending requests"],routes:["","  route table: 3 live threads · 2 dormant"],intel:["","  intel queue: "+intel+" packets · latest sealed"],clear:["ok","  clearance " + fmtClear + " confirmed — silent sector"],seal:["","  session sealed. whisper again anytime."]};
    var m=map[w];
    cons(m[0],m[1]);
    cons("pr","seter $ _");
  }
  renderLog();renderOps();
})();
</script>
</body>
</html>
